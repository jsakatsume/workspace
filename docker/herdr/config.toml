# Shared Herdr workflow configuration for the development container.
# Personal themes, sounds, and keybindings intentionally stay out of this file.
# Workflow-critical values are pinned even when they match Herdr defaults.
onboarding = false

[terminal]
default_shell = "/bin/bash"
new_cwd = "follow"

[worktrees]
directory = "/home/ubuntu/.herdr/worktrees"

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[session]
resume_agents_on_restore = true

[experimental]
pane_history = false
