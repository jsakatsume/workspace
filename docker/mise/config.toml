[settings]
lockfile = true

[tools]
node = "24"
fzf = "latest"
ripgrep = "latest"
gh = "latest"
lazygit = "latest"
fd = "latest"
yazi = "latest"
"aqua:neovim/neovim" = "latest"
starship = "latest"
herdr = "latest"
usage = "latest"
# npm packages whose postinstall fetches a native binary; mise skips scripts by
# default (--ignore-scripts), so opt back in or `claude` ships no usable binary.
"npm:@anthropic-ai/claude-code" = { version = "latest", npm_args = "--ignore-scripts=false" }
"npm:@openai/codex" = { version = "latest", npm_args = "--ignore-scripts=false" }
